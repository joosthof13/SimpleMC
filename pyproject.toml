[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simplemc"
version = "0.1.0"
description = "Simple Monte Carlo simulation tools for Python"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Jozua Oosthof"}
]

dependencies = [
    "numpy>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6"
]

[tool.setuptools.packages.find]
include = ["simplemc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"